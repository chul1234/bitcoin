<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비트코인 거래소 - 투자 내역</title>
    <!-- 폰트 및 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js 라이브러리 (원 그래프용) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 공통 스타일시트 및 투자내역 전용 스타일 -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/investment.css">
</head>
<body>
    <!-- 마이페이지와 동일한 그리드 레이아웃 구조 (사이드바 메뉴가 위로 안뜨게 수정) -->
    <div id="dashboard-screen" class="screen view-active">
        <div class="dashboard-layout" style="grid-template-columns: 80px 1fr;"> <!-- 좌측 80px 사이드바 강제 고정 -->
            
            <!-- 좌측 사이드바 -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span class="logo-text">CD</span>
                </div>
                <nav class="nav-menu">
                    <!-- 대시보드(차트) 홈 버튼 -->
                    <button class="nav-item" title="차트 보드" onclick="window.location.href='dashboard.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    </button>
                    <!-- 투자 내역 (포트폴리오) 버튼 -->
                    <button class="nav-item active" title="투자 내역" onclick="window.location.href='investment.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
                    </button>
                    <!-- 커뮤니티 (게시판) 버튼 -->
                    <button class="nav-item" title="커뮤니티" onclick="window.location.href='board.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </button>
                    <!-- 마이페이지 이동 버튼 -->
                    <button class="nav-item" title="마이페이지" onclick="window.location.href='mypage.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </button>
                    <!-- 관리자 메뉴 탭 -->
                    <button class="nav-item" title="관리" onclick="window.location.href='admin.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
                    </button>
                </nav>
                <div class="sidebar-footer">
                    <button id="logout-btn" class="nav-item" title="로그아웃"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </aside>

            <!-- 메인 콘텐츠 영역 -->
            <main class="main-content" style="padding: 3rem; background-color: var(--bg-color); height: 100vh; overflow-y: auto;">
                <header class="main-header" style="margin-bottom: 2rem;">
                    <div class="header-left">
                        <h1 style="color: var(--text-main); font-size: 1.8rem; font-weight: 700;">투자 내역</h1>
                        <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 1rem;">나의 자산 및 투자 포트폴리오를 확인하세요.</p>
                    </div>
                </header>

                <div style="display: flex; flex-direction: column; gap: 2rem;">
                    <!-- 1. 자산 요약 대시보드 (4카드 확장) -->
                    <div class="portfolio-dashboard" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; max-width: none;">
                        
                        <div class="asset-card" style="background: linear-gradient(135deg, rgba(38,166,154,0.1), rgba(30,41,59,0.4)); border: 1px solid rgba(38,166,154,0.2); position: relative; overflow: hidden;">
                            <div style="position: absolute; right: -15px; top: -15px; width: 80px; height: 80px; background: radial-gradient(circle, rgba(38,166,154,0.15) 0%, transparent 70%); border-radius: 50%;"></div>
                            <span class="asset-label" style="color:var(--text-main); font-size:1rem;">총 보유 자산</span>
                            <div class="asset-value" style="font-size: 1.9rem; font-weight: 800; margin-top:0.5rem;"><span id="total-assets-val">0</span> <span style="font-size:1rem;color:var(--text-muted); font-weight:500;">KRW</span></div>
                        </div>
                        
                        <div class="asset-card" style="box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                            <span class="asset-label">보유 현금</span>
                            <div class="asset-value" style="font-size: 1.6rem; margin-top:0.5rem;"><span id="krw-balance-val">0</span> <span style="font-size:0.9rem;color:var(--text-muted);">KRW</span></div>
                        </div>
                        
                        <div class="asset-card" style="box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                            <span class="asset-label">총 매수 금액</span>
                            <div class="asset-value" style="font-size: 1.6rem; margin-top:0.5rem;"><span id="total-buy-val">0</span> <span style="font-size:0.9rem;color:var(--text-muted);">KRW</span></div>
                        </div>
                        
                        <div class="asset-card" style="border-right: 4px solid #EF4444; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);" id="pnl-card">
                            <span class="asset-label">총 평가 손익</span>
                            <div class="asset-value" style="font-size: 1.6rem; font-weight:700; margin-top:0.5rem;">
                                <span id="total-pnl-val">0</span> 
                                <span id="total-pnl-rate" style="font-size:0.95rem;">(0.00%)</span>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 포트폴리오 차트 & 보유 코인 목록 (2단 그리드) -->
                    <div style="display: grid; grid-template-columns: minmax(350px, 1fr) minmax(600px, 2fr); gap: 2rem; align-items: start;">
                        
                        <!-- 좌측: 도넛 차트 -->
                        <div class="portfolio-chart-container" style="margin:0; height: 100%; max-width: none; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                            <div class="chart-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 1.2rem; margin-bottom: 1.5rem;">
                                <h3 style="font-size:1.15rem; color:var(--text-main); display:flex; align-items:center; gap:0.5rem;"><span>📊</span> 자산 비중</h3>
                            </div>
                            <div class="chart-wrapper" style="height: 320px;">
                                <canvas id="portfolioChart"></canvas>
                            </div>
                        </div>

                        <!-- 우측: 보유 코인 리스트 테이블 -->
                        <div class="holdings-container" style="background: var(--bg-panel); border-radius: 16px; border: 1px solid var(--border-color); padding: 1.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                            <div class="chart-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 1.2rem; margin-bottom: 1rem; display:flex; justify-content:space-between; align-items:center;">
                                <h3 style="font-size:1.15rem; color:var(--text-main); display:flex; align-items:center; gap:0.5rem;"><span>💼</span> 보유 자산 목록</h3>
                            </div>
                            
                            <div style="overflow-x: auto;">
                                <table style="width: 100%; border-collapse: collapse; text-align: right; font-size: 0.95rem;">
                                    <thead>
                                        <tr style="color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.85rem;">
                                            <th style="padding: 1rem 0.5rem; text-align: left; font-weight:500;">보유자산</th>
                                            <th style="padding: 1rem 0.5rem; font-weight:500;">보유수량</th>
                                            <th style="padding: 1rem 0.5rem; font-weight:500;">매수평균가</th>
                                            <th style="padding: 1rem 0.5rem; font-weight:500;">평가금액</th>
                                            <th style="padding: 1rem 0.5rem; font-weight:500;">평가손익</th>
                                        </tr>
                                    </thead>
                                    <tbody id="holdings-tbody">
                                        <!-- js/investment.js에서 동적 생성 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 공통 로그인 세션 체크 스크립트 연결 -->
    <script src="js/common.js"></script>
    <script src="js/app.js"></script>
    <!-- 포트폴리오 연동 스크립트 -->
    <script src="js/investment.js"></script>
</body>
</html>
